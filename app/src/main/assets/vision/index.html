<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0, user-scalable=yes" />
  <title>Kavya Vision Canvas</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #stage {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #070B12;
      color: #E2E8F0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }
    #stage { position: relative; }
    #hud {
      position: absolute;
      left: 8px;
      right: 8px;
      bottom: 8px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      pointer-events: none;
      z-index: 40;
    }
    #hud .pill {
      pointer-events: auto;
      background: rgba(9, 14, 24, 0.86);
      border: 1px solid rgba(56, 189, 248, 0.4);
      color: #E2E8F0;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 11px;
      cursor: pointer;
    }
    #hud .pill.active {
      background: rgba(14, 165, 233, 0.25);
      border-color: #38BDF8;
      color: #7DD3FC;
    }
    #attribution {
      position: absolute;
      top: 8px;
      left: 8px;
      max-width: 75%;
      background: rgba(9, 14, 24, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.14);
      padding: 4px 8px;
      border-radius: 8px;
      font-size: 10px;
      color: #94A3B8;
      z-index: 35;
      display: none;
    }
    #statusBanner {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
      font-size: 13px;
      background: rgba(7, 11, 18, 0.94);
      color: #CBD5E1;
      z-index: 50;
    }
  </style>
</head>
<body>
  <div id="stage"></div>
  <div id="attribution"></div>
  <div id="hud"></div>
  <div id="statusBanner"></div>

  <script src="/assets/vision/engines/bridge.js"></script>
  <script src="/assets/vision/engines/spatial_3d.js"></script>
  <script src="/assets/vision/engines/diagrams.js"></script>
  <script src="/assets/vision/engines/charts_and_motion.js"></script>
</body>
</html>
