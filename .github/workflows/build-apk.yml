# Build trigger refresh
name: Build Kavya APK

on:
  workflow_dispatch:
  push:
    branches: ["main", "fix/ci-robolectric-java21"]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "platforms;android-36.1" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.3.1'

      - name: Create debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Create build environment file
        run: cp .env.example .env

      - name: Run Unit Tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Run Android Lint
        run: gradle :app:lintDebug --stacktrace

      - name: Build debug APK
        id: build_apk
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload Test & Lint Reports on Failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: kavya-ci-failure-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload APK
        if: steps.build_apk.outcome == 'success'
        uses: actions/upload-artifact@v6
        with:
          name: kavya-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

