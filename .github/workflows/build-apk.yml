name: Build Kavya APK

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "cmake;3.31.6" "ndk;27.2.12479018"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.3.1'

      - name: Create debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Create build environment file
        run: cp .env.example .env

      # Keep test results visible, but do not prevent a valid APK from being uploaded.
      - name: Run unit tests
        id: unit_tests
        continue-on-error: true
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        id: build_apk
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        if: steps.build_apk.outcome == 'success'
        uses: actions/upload-artifact@v6
        with:
          name: kavya-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      # Preserve a failing workflow conclusion if tests fail, after the APK upload.
      - name: Report unit-test failure
        if: always() && steps.unit_tests.outcome == 'failure'
        run: |
          echo "Unit tests failed. APK build/upload was attempted separately; inspect the test report."
          exit 1
